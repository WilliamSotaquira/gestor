<!-- Redes -->

<div class="btn-group" role="group" aria-label="Compartir en redes sociales">

	<a class="btn" href="javascript:void(0);" role="button" id="getlink" aria-label="Copiar enlace de la noticia">
		<img src="/_catalogs/masterpage/Gobierno/img/icons/icon-share.png" alt="Compartir">
	</a>

	<!--<a class="btn" href="#" id="share-instagram" role="button"><img src="/_catalogs/masterpage/Gobierno/img/icons/purpura/icon-instagram-purpura.png" alt="Compartir en Instagram"></a>-->
	<a class="btn" href="javascript:void(0);" id="share-facebook" role="button" aria-label="Compartir en Facebook">
		<img src="/_catalogs/masterpage/Gobierno/img/icons/purpura/icon-facebook-purpura.png" alt="Compartir en Facebook">
	</a>
	<a class="btn" href="javascript:void(0);" id="share-x" role="button" aria-label="Compartir en X">
		<img src="/_catalogs/masterpage/Gobierno/img/icons/purpura/icon-twitter-purpura.png" alt="Compartir en X">
	</a>
	<a class="btn" href="javascript:void(0);" id="share-whatsapp" role="button" aria-label="Compartir en WhatsApp">
		<img src="/_catalogs/masterpage/Gobierno/img/icons/purpura/icon-wa-violeta-contorno.png" alt="Compartir en WhatsApp">
	</a>

</div>

<script>
(function () {
	// Guarda anti doble ejecución: si el bloque se renderiza más de una vez
	// (comportamiento típico del gestor de contenidos), no volvemos a inicializar.
	if (window.__redesNoticiasInit) {
		return;
	}
	window.__redesNoticiasInit = true;

	// URL limpia de la noticia (sin query ni hash)
	function getUrlLimpia() {
		return window.location.href.split('?')[0].split('#')[0];
	}

	// Aviso temporal tipo toast
	function mostrarAviso(mensaje) {
		var aviso = document.createElement('div');
		aviso.setAttribute('role', 'status');
		aviso.style.cssText = [
			'position:fixed',
			'z-index:9999999',
			'left:50%',
			'bottom:32px',
			'transform:translateX(-50%) translateY(12px)',
			'display:flex',
			'align-items:center',
			'gap:10px',
			'padding:12px 20px',
			'background:#0943B5',
			'color:#ffffff',
			'border-radius:8px',
			'box-shadow:0 4px 16px rgba(0,0,0,0.18)',
			'font-family:"Nunito Sans", Verdana, sans-serif',
			'font-size:15px',
			'font-weight:600',
			'opacity:0',
			'transition:opacity .2s ease, transform .2s ease'
		].join(';');
		aviso.innerHTML = '<span aria-hidden="true" style="font-size:18px; line-height:1;">&#10003;</span>' +
			'<span></span>';
		aviso.lastChild.textContent = mensaje;
		document.body.appendChild(aviso);

		// Forzar el reflow para que la transición de entrada se aplique
		requestAnimationFrame(function () {
			aviso.style.opacity = '1';
			aviso.style.transform = 'translateX(-50%) translateY(0)';
		});

		setTimeout(function () {
			aviso.style.opacity = '0';
			aviso.style.transform = 'translateX(-50%) translateY(12px)';
			setTimeout(function () {
				if (aviso.parentNode) {
					aviso.parentNode.removeChild(aviso);
				}
			}, 200);
		}, 2000);
	}

	// Copiado con fallback para navegadores/contextos sin Clipboard API
	function copiarTexto(texto) {
		if (navigator.clipboard && navigator.clipboard.writeText) {
			navigator.clipboard.writeText(texto).then(function () {
				mostrarAviso('URL copiada');
			}).catch(function () {
				copiarConFallback(texto);
			});
		} else {
			copiarConFallback(texto);
		}
	}

	function copiarConFallback(texto) {
		var campo = document.createElement('textarea');
		campo.value = texto;
		campo.setAttribute('readonly', '');
		campo.style.position = 'absolute';
		campo.style.left = '-9999px';
		document.body.appendChild(campo);
		campo.select();
		var ok = false;
		try {
			ok = document.execCommand('copy');
		} catch (e) {
			ok = false;
		}
		document.body.removeChild(campo);
		mostrarAviso(ok ? 'URL copiada' : 'No fue posible copiar el enlace');
	}

	// Registra un handler de click en un botón, descartando cualquier listener
	// previo. Clonar el nodo elimina los listeners heredados de scripts legados
	// (p. ej. el bloque "Compartir redes1" de la plantilla), evitando que el
	// clic dispare dos ventanas.
	function enlazarLimpio(id, manejador) {
		var boton = document.getElementById(id);
		if (!boton || boton.dataset.redesBind === '1') {
			return;
		}
		// Reemplaza el botón por un clon sin listeners y opera sobre el clon.
		var limpio = boton.cloneNode(true);
		boton.parentNode.replaceChild(limpio, boton);
		limpio.dataset.redesBind = '1';
		limpio.addEventListener('click', manejador);
	}

	// Abre una única ventana de compartir
	function abrirVentana(url) {
		window.open(url, '_blank', 'noopener,noreferrer,width=600,height=500');
	}

	function inicializar() {
		// Copiar enlace al portapapeles
		enlazarLimpio('getlink', function () {
			copiarTexto(getUrlLimpia());
		});

		// Compartir en redes: se leen URL y título en el momento del clic
		enlazarLimpio('share-facebook', function () {
			var enlace = encodeURIComponent(getUrlLimpia());
			abrirVentana('https://www.facebook.com/sharer/sharer.php?u=' + enlace);
		});

		enlazarLimpio('share-x', function () {
			var enlace = encodeURIComponent(getUrlLimpia());
			var titulo = encodeURIComponent(document.title || '');
			abrirVentana('https://twitter.com/intent/tweet?url=' + enlace + '&text=' + titulo);
		});

		enlazarLimpio('share-whatsapp', function () {
			var enlace = encodeURIComponent(getUrlLimpia());
			var titulo = encodeURIComponent(document.title || '');
			abrirVentana('https://api.whatsapp.com/send?text=' + titulo + '%20' + enlace);
		});
	}

	// El script legado engancha sus listeners en DOMContentLoaded. Ejecutamos
	// la inicialización DESPUÉS de ese evento para que el clonado descarte esos
	// listeners heredados. Si el DOM ya está listo, se corre al instante.
	if (document.readyState === 'loading') {
		document.addEventListener('DOMContentLoaded', function () {
			// setTimeout(0) asegura correr tras los demás handlers de DOMContentLoaded
			setTimeout(inicializar, 0);
		});
	} else {
		setTimeout(inicializar, 0);
	}
})();
</script>
